  build-libretro-linux-gnu:
    needs: build-libretro-stage1
    name: LR GNU/Linux ${{ matrix.arch_mkxpz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: armv6
            arch_debian: armhf
            arch_llvm: arm-linux-gnueabihf
            cpu_family: arm
            cpu: generic-armv6zk+vfpv2
            endian: little
          - arch_mkxpz: armv7
            arch_debian: armhf
            arch_llvm: arm-linux-gnueabihf
            cpu_family: arm
            cpu: generic-armv7-a+vfpv3-d16
            endian: little
          - arch_mkxpz: armv7-neon
            arch_debian: armhf
            arch_llvm: arm-linux-gnueabihf
            cpu_family: arm
            cpu: generic-armv7-a+neon
            endian: little
          - arch_mkxpz: arm64
            arch_debian: arm64
            arch_llvm: aarch64-linux-gnu
            cpu_family: aarch64
            cpu: generic-armv8-a
            endian: little
          - arch_mkxpz: power8le
            arch_debian: ppc64el
            arch_llvm: powerpc64le-linux-gnu
            cpu_family: ppc64
            cpu: power8
            endian: little
          - arch_mkxpz: power9le
            arch_debian: ppc64el
            arch_llvm: powerpc64le-linux-gnu
            cpu_family: ppc64
            cpu: power9
            endian: little
          - arch_mkxpz: s390x
            arch_debian: s390x
            arch_llvm: s390x-linux-gnu
            cpu_family: s390x
            cpu: z196
            endian: big
          - arch_mkxpz: x86
            arch_debian: i386
            arch_llvm: i386-linux-gnu
            cpu_family: x86
            cpu: i386
            endian: little
          - arch_mkxpz: x86_64
            arch_debian: amd64
            arch_llvm: x86_64-linux-gnu
            cpu_family: x86_64
            cpu: x86_64
            endian: little
    steps:
      - name: Expose Actions environment
        uses: white-axe/expose-actions-environment@v1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y qemu-user-static binfmt-support git build-essential clang llvm meson cmake nodejs npm
          npm install @actions/artifact@4 fast-glob@3

      - name: Set up sysroot
        run: |
          cd ${{ runner.temp }}
          mkdir sysroot
          curl -Lo sysroot.tar.xz https://cloud-images.ubuntu.com/xenial/current/xenial-server-cloudimg-${{ matrix.arch_debian }}-root.tar.xz
          tar -xJf sysroot.tar.xz -C sysroot --exclude 'dev/*'

          touch sysroot/dev/full
          touch sysroot/dev/null
          touch sysroot/dev/random
          touch sysroot/dev/urandom
          touch sysroot/dev/zero
          sudo mount --bind /dev/full sysroot/dev/full
          sudo mount --bind /dev/null sysroot/dev/null
          sudo mount --bind /dev/random sysroot/dev/random
          sudo mount --bind /dev/urandom sysroot/dev/urandom
          sudo mount --bind /dev/zero sysroot/dev/zero
          chmod 777 sysroot/tmp/
          rm -f sysroot/etc/resolv.conf
          cp /etc/resolv.conf sysroot/etc/

          PATH=/usr/sbin:/usr/bin:/sbin:/bin sudo chroot sysroot /bin/bash -e -c '
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt update
            apt install -y gcc-9 g++-9
            cp /usr/lib/${{ matrix.arch_llvm }}/libm.so /usr/lib/${{ matrix.arch_llvm }}/libm.a
          '

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download stage 1
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-stage1.outputs.artifact-id }}, {
              path: "libretro/build/libretro-stage1",
            });
          '

      - name: Configure core
        run: |
          echo "[binaries]" | tee -a ${{ runner.temp }}/cross.ini
          echo "c = ['clang', '--target=${{ matrix.arch_llvm }}', '--sysroot=${{ runner.temp }}/sysroot']" | tee -a ${{ runner.temp }}/cross.ini
          echo "c_ld = 'lld'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpp = ['clang++', '--target=${{ matrix.arch_llvm }}', '--sysroot=${{ runner.temp }}/sysroot']" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpp_ld = 'lld'" | tee -a ${{ runner.temp }}/cross.ini
          echo "ar = 'llvm-ar'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cmake = 'cmake'" | tee -a ${{ runner.temp }}/cross.ini
          echo "[host_machine]" | tee -a ${{ runner.temp }}/cross.ini
          echo "system = 'linux'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu_family = '${{ matrix.cpu_family }}'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu = '${{ matrix.cpu }}'" | tee -a ${{ runner.temp }}/cross.ini
          echo "endian = '${{ matrix.endian }}'" | tee -a ${{ runner.temp }}/cross.ini
          echo "[properties]" | tee -a ${{ runner.temp }}/cross.ini
          echo "sys_root = '${{ runner.temp }}/sysroot'" | tee -a ${{ runner.temp }}/cross.ini
          echo "[cmake]" | tee -a ${{ runner.temp }}/cross.ini
          echo "CMAKE_EXE_LINKER_FLAGS_INIT = '-fuse-ld=lld'" | tee -a ${{ runner.temp }}/cross.ini
          echo '--------------------------------------------------------------------------------'
          # If architecture is s390x and Clang version is older than 19.1.0, disable LTO due to https://github.com/llvm/llvm-project/issues/61101
          if [ '${{ matrix.arch_mkxpz }}' = 's390x' ] && (echo "$(clang --version | head -n 1 | sed -e 's/.*clang version * \([0-9.]*\).*/\1/')\n19.1.0" | sort -CV)
          then
            lto=false
          else
            lto=true
          fi
          if [ '${{ matrix.arch_mkxpz }}' = 'armv7-neon' ]
          then
            neon=true
          else
            neon=false
          fi
          CLICOLOR_FORCE=1 meson setup build --cross-file ${{ runner.temp }}/cross.ini --buildtype release -Db_lto=$lto -Dneon=$neon -Dlibretro=true -Dlibretro_save_states=true

      - name: Build core
        run: |
          mkdir ${{ runner.temp }}/dist
          cd build
          CLICOLOR_FORCE=1 ninja -v
          llvm-strip mkxp-z_libretro.so
          mv mkxp-z_libretro.so ${{ runner.temp }}/dist/mkxp-z_libretro.so

      - name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir("${{ runner.temp }}/dist");
            const artifact = new DefaultArtifactClient();
            await artifact.uploadArtifact(
              "mkxp-z_libretro.linux-gnu.${{ matrix.arch_mkxpz }}.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
          '

