  build-libretro-webos:
    needs: build-libretro-stage1
    name: LR webOS
    runs-on: ubuntu-latest
    steps:
      - name: Expose Actions environment
        uses: white-axe/expose-actions-environment@v1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential meson cmake nodejs npm
          npm install @actions/artifact@4 fast-glob@3

      - name: Set up webOS SDK
        run: |
          tag_name=$(curl -s https://api.github.com/repos/openlgtv/buildroot-nc4/releases/latest -H 'Authorization: Bearer ${{ github.token }}' -H 'X-GitHub-Api-Version: 2022-11-28' | jq -r '.tag_name')
          curl -Lo ${{ runner.temp }}/webos-sdk.tar.gz https://github.com/openlgtv/buildroot-nc4/releases/download/$tag_name/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          mkdir ${{ runner.temp }}/webos-sdk
          tar -xzf ${{ runner.temp }}/webos-sdk.tar.gz -C ${{ runner.temp }}/webos-sdk --strip-components=1
          rm ${{ runner.temp }}/webos-sdk.tar.gz

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download stage 1
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-stage1.outputs.artifact-id }}, {
              path: "libretro/build/libretro-stage1",
            });
          '

      - name: Configure core
        run: |
          echo "[binaries]" | tee -a ${{ runner.temp }}/cross.ini
          echo "c = '${{ runner.temp }}/webos-sdk/bin/arm-webos-linux-gnueabi-gcc'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpp = '${{ runner.temp }}/webos-sdk/bin/arm-webos-linux-gnueabi-g++'" | tee -a ${{ runner.temp }}/cross.ini
          echo "ar = '${{ runner.temp }}/webos-sdk/bin/arm-webos-linux-gnueabi-ar'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cmake = 'cmake'" | tee -a ${{ runner.temp }}/cross.ini
          echo "[host_machine]" | tee -a ${{ runner.temp }}/cross.ini
          echo "system = 'linux'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu_family = 'arm'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu = 'generic-armv7-a+neon'" | tee -a ${{ runner.temp }}/cross.ini
          echo "endian = 'little'" | tee -a ${{ runner.temp }}/cross.ini
          echo '--------------------------------------------------------------------------------'
          CLICOLOR_FORCE=1 meson setup build --cross-file ${{ runner.temp }}/cross.ini --buildtype release -Db_lto=true -Dstatic_libstdcpp=true -Dneon=true -Dlibretro=true -Dlibretro_save_states=true

      - name: Build core
        run: |
          mkdir ${{ runner.temp }}/dist
          cd build
          CLICOLOR_FORCE=1 ninja -v
          ${{ runner.temp }}/webos-sdk/bin/arm-webos-linux-gnueabi-strip mkxp-z_libretro.so
          mv mkxp-z_libretro.so ${{ runner.temp }}/dist/mkxp-z_libretro.so

      - name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir("${{ runner.temp }}/dist");
            const artifact = new DefaultArtifactClient();
            await artifact.uploadArtifact(
              "mkxp-z_libretro.webos.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
          '

  build-libretro-darwin:
    needs: build-libretro-stage1
    name: LR ${{ matrix.system_name }} ${{ matrix.arch_mkxpz }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - system_name: macOS
            system_mkxpz: macos
            sdk: macosx
            suffix: ""
            arch_mkxpz: arm64
            arch_llvm: arm64-apple-macos11.0 # macOS 11 is the first version of macOS with support for 64-bit ARM
            cpu_family: aarch64
            cpu: generic-armv8-a
            endian: little
          - system_name: macOS
            system_mkxpz: macos
            sdk: macosx
            suffix: ""
            arch_mkxpz: x86_64
            arch_llvm: x86_64-apple-macos10.7 # macOS 10.7 is the first version of macOS with support for thread-local storage, which we currently need
            cpu_family: x86_64
            cpu: x86_64
            endian: little
          - system_name: iOS
            system_mkxpz: ios
            sdk: iphoneos
            suffix: _ios
            arch_mkxpz: arm64
            arch_llvm: arm64-apple-ios10.0 # iOS 10 is the first version of iOS with support for 64-bit ARM
            cpu_family: aarch64
            cpu: generic-armv8-a
            endian: little
          - system_name: tvOS
            system_mkxpz: tvos
            sdk: appletvos
            suffix: _tvos
            arch_mkxpz: arm64
            arch_llvm: arm64-apple-tvos9.0 # tvOS 9 is the first version of tvOS with support for installing apps
            cpu_family: aarch64
            cpu: generic-armv8-a
            endian: little
    steps:
      - name: Expose Actions environment
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Install dependencies
        run: |
          brew uninstall -f --ignore-dependencies git meson cmake node
          brew install -q git meson cmake node
          npm install @actions/artifact@4 fast-glob@3

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download stage 1
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-stage1.outputs.artifact-id }}, {
              path: "libretro/build/libretro-stage1",
            });
          '

      - name: Configure core
        run: |
          echo "[binaries]" | tee -a ${{ runner.temp }}/cross.ini
          echo "c = ['xcrun', '--sdk', '${{ matrix.sdk }}', 'clang', '--target=${{ matrix.arch_llvm }}']" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpp = ['xcrun', '--sdk', '${{ matrix.sdk }}', 'clang++', '--target=${{ matrix.arch_llvm }}']" | tee -a ${{ runner.temp }}/cross.ini
          echo "ar = 'ar'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cmake = 'cmake'" | tee -a ${{ runner.temp }}/cross.ini
          echo "[host_machine]" | tee -a ${{ runner.temp }}/cross.ini
          echo "system = 'darwin'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu_family = '${{ matrix.cpu_family }}'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu = '${{ matrix.cpu }}'" | tee -a ${{ runner.temp }}/cross.ini
          echo "endian = '${{ matrix.endian }}'" | tee -a ${{ runner.temp }}/cross.ini
          echo '--------------------------------------------------------------------------------'
          CLICOLOR_FORCE=1 meson setup build --cross-file ${{ runner.temp }}/cross.ini --buildtype release -Db_lto=true -Dlibretro=true -Dlibretro_save_states=true

      - name: Build core
        run: |
          mkdir ${{ runner.temp }}/dist
          cd build
          CLICOLOR_FORCE=1 ninja -v
          strip -x mkxp-z_libretro.dylib
          mv mkxp-z_libretro.dylib ${{ runner.temp }}/dist/mkxp-z_libretro${{ matrix.suffix }}.dylib

      - name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir("${{ runner.temp }}/dist");
            const artifact = new DefaultArtifactClient();
            await artifact.uploadArtifact(
              "mkxp-z_libretro.${{ matrix.system_mkxpz }}.${{ matrix.arch_mkxpz }}.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
          '

  build-libretro-emscripten:
    needs: build-libretro-stage1
    name: LR Emscripten ${{ matrix.threading }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - threading: threaded
          - threading: unthreaded
    steps:
      - name: Expose Actions environment
        uses: white-axe/expose-actions-environment@v1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential meson cmake jq nodejs npm
          npm install @actions/artifact@4 fast-glob@3

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download stage 1
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-stage1.outputs.artifact-id }}, {
              path: "libretro/build/libretro-stage1",
            });
          '

      - name: Configure core
        run: |
          echo "[binaries]" | tee -a ${{ runner.temp }}/cross.ini
          echo "c = 'emcc'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpp = 'em++'" | tee -a ${{ runner.temp }}/cross.ini
          echo "ar = 'emar'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cmake = 'cmake'" | tee -a ${{ runner.temp }}/cross.ini
          echo "[host_machine]" | tee -a ${{ runner.temp }}/cross.ini
          echo "system = 'emscripten'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu_family = 'wasm32'" | tee -a ${{ runner.temp }}/cross.ini
          echo "cpu = 'wasm32'" | tee -a ${{ runner.temp }}/cross.ini
          echo "endian = 'little'" | tee -a ${{ runner.temp }}/cross.ini
          echo "[properties]" | tee -a ${{ runner.temp }}/cross.ini
          echo "cmake_toolchain_file = '$(em-config EMSCRIPTEN_ROOT)/cmake/Modules/Platform/Emscripten.cmake'" | tee -a ${{ runner.temp }}/cross.ini
          echo '--------------------------------------------------------------------------------'
          if [ '${{ matrix.threading }}' = 'threaded' ]
          then
            threaded=true
          else
            threaded=false
          fi
          CLICOLOR_FORCE=1 meson setup build --cross-file ${{ runner.temp }}/cross.ini --buildtype release -Db_lto=true -Dlibretro=true -Dlibretro_save_states=true -Demscripten_threaded=$threaded

      - name: Build core
        run: |
          mkdir ${{ runner.temp }}/dist
          cd build
          CLICOLOR_FORCE=1 ninja -v
          mv mkxp-z_libretro.a ${{ runner.temp }}

      - name: Build frontend
        run: |
          cd ${{ runner.temp }}
          tag_name=$(curl -s https://api.github.com/repos/libretro/RetroArch/releases/latest -H 'Authorization: Bearer ${{ github.token }}' -H 'X-GitHub-Api-Version: 2022-11-28' | jq -r '.tag_name')
          git clone https://github.com/libretro/RetroArch retroarch --depth 1 -b "$tag_name"
          mv mkxp-z_libretro.a retroarch/libretro_emscripten.a
          cd retroarch
          if [ '${{ matrix.threading }}' = 'threaded' ]
          then
            flags='HAVE_THREADS=1 PROXY_TO_PTHREAD=1 HAVE_AUDIOWORKLET=1 HAVE_RWEBAUDIO=0 HAVE_AL=0 HAVE_WASMFS=1 HAVE_EXTRA_WASMFS=1'
          else
            flags='HAVE_THREADS=0 PROXY_TO_PTHREAD=0 HAVE_AUDIOWORKLET=0 HAVE_RWEBAUDIO=1 HAVE_AL=1 HAVE_WASMFS=0 HAVE_EXTRA_WASMFS=0'
          fi
          CLICOLOR_FORCE=1 emmake make -f Makefile.emscripten LIBRETRO=mkxp-z $flags
          mv mkxp-z_libretro.wasm ${{ runner.temp }}/dist/mkxp-z_libretro.wasm
          mv mkxp-z_libretro.js ${{ runner.temp }}/dist/mkxp-z_libretro.js

      - name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir("${{ runner.temp }}/dist");
            const artifact = new DefaultArtifactClient();
            await artifact.uploadArtifact(
              "mkxp-z_libretro.emscripten.${{ matrix.threading }}.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
          '

