  build-libretro-wiiu:
    needs:
      - build-libretro-stage1
      - wiiurpxtool
    name: LR Wii U
    runs-on: ubuntu-latest
    container:
      # We're supposed to use libretro-build-wiiu, but that currently has a really old version of devkitPPC that doesn't support C++17, so it can't compile OpenAL Soft.
      # Also, pre-C++17 versions of OpenAL Soft give linker errors when we try to build them for Wii U, so we can't just downgrade OpenAL Soft.
      # The libretro-build-devkitpro image that we're using here instead currently has a newer version of devkitPPC that supports C++17 but lacks wiiurpxtool, which is why we need to separately install wiiurpxtool.
      image: reallibretroretroarch/libretro-build-devkitpro:latest
      options: -u root
    steps:
      - name: Expose Actions environment
        uses: white-axe/expose-actions-environment@v1

      - name: Install dependencies
        shell: bash
        run: |
          curl -Lo ~/Miniforge3.sh "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash ~/Miniforge3.sh -b -p ~/miniforge3
          source ~/miniforge3/etc/profile.d/conda.sh
          conda install -y nodejs=22 git jq meson cmake
          PATH="$HOME/miniforge3/bin:$PATH" npm install @actions/artifact@4 fast-glob@3
          echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download stage 1
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-stage1.outputs.artifact-id }}, {
              path: "libretro/build/libretro-stage1",
            });
          '

      - name: Download wiiurpxtool
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.wiiurpxtool.outputs.artifact-id }}, {
              path: process.env.HOME,
            });
          '

      - name: Install wiiurpxtool
        run: |
          if command -v wiiurpxtool
          then
            echo 'wiiurpxtool already installed'
          else
            mv ~/wiiurpxtool /usr/local/bin
            chmod +x /usr/local/bin/wiiurpxtool
            echo 'wiiurpxtool successfully installed'
          fi
          wiiurpxtool

      - name: Configure core
        run: |
          git config --global --add safe.directory "$(pwd)"
          CLICOLOR_FORCE=1 meson setup build --cross-file libretro/meson-wiiu.txt --buildtype release -Db_lto=true -Dlibretro=true -Dlibretro_save_states=true

      - name: Build core
        run: |
          mkdir ~/dist
          cd build
          CLICOLOR_FORCE=1 ninja -v
          mv mkxp-z_libretro.a ~

      - name: Build frontend
        run: |
          cd ~
          git clone https://github.com/libretro/RetroArch retroarch --depth 1 -b $(curl -s https://api.github.com/repos/libretro/RetroArch/releases/latest -H 'Authorization: Bearer ${{ github.token }}' -H 'X-GitHub-Api-Version: 2022-11-28' | jq -r '.tag_name')
          mv mkxp-z_libretro.a retroarch/libretro_wiiu.a
          cd retroarch
          CLICOLOR_FORCE=1 make -f Makefile.wiiu LIBRETRO=mkxp-z
          mv retroarch_wiiu.rpx ~/dist/mkxp-z_libretro.rpx

      - name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir(process.env.HOME + "/dist");
            const artifact = new DefaultArtifactClient();
            await artifact.uploadArtifact(
              "mkxp-z_libretro.wiiu.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
          '

  build-libretro-ps4:
    needs: build-libretro-stage1
    name: LR PlayStation 4
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-orbis:latest
      options: -u root
    steps:
      - name: Expose Actions environment
        uses: white-axe/expose-actions-environment@v1

      - name: Install dependencies
        run: |
          apk add git jq curl python3 gcc g++ ninja nodejs npm
          python3 -m ensurepip
          python3 -m pip install meson cmake
          npm install @actions/artifact@4 fast-glob@3

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download stage 1
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-stage1.outputs.artifact-id }}, {
              path: "libretro/build/libretro-stage1",
            });
          '

      - name: Configure core
        run: |
          git config --global --add safe.directory "$(pwd)"
          CLICOLOR_FORCE=1 meson setup build --cross-file libretro/meson-ps4.txt --buildtype release -Db_lto=false -Dlibretro=true -Dlibretro_save_states=true

      - name: Build core
        run: |
          mkdir ~/dist
          cd build
          CLICOLOR_FORCE=1 ninja -v
          mv mkxp-z_libretro.a ~

      - name: Build frontend
        run: |
          cd ~
          git clone https://github.com/libretro/RetroArch retroarch --depth 1 -b $(curl -s https://api.github.com/repos/libretro/RetroArch/releases/latest -H 'Authorization: Bearer ${{ github.token }}' -H 'X-GitHub-Api-Version: 2022-11-28' | jq -r '.tag_name')
          mv mkxp-z_libretro.a retroarch/libretro_orbis.a
          cd retroarch
          CLICOLOR_FORCE=1 make -f Makefile.orbis LIBRETRO=mkxp-z
          mv retroarch_orbis.self ~/dist/mkxp-z_libretro_orbis.self

      - name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir(process.env.HOME + "/dist");
            const artifact = new DefaultArtifactClient();
            await artifact.uploadArtifact(
              "mkxp-z_libretro.ps4.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
          '

  build-libretro-switch:
    needs: build-libretro-stage1
    name: LR Nintendo Switch core
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: -u root
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - name: Expose Actions environment
        uses: white-axe/expose-actions-environment@v1

      - name: Install dependencies
        shell: bash
        run: |
          curl -Lo ~/Miniforge3.sh "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash ~/Miniforge3.sh -b -p ~/miniforge3
          source ~/miniforge3/etc/profile.d/conda.sh
          conda install -y nodejs=22 git jq meson cmake
          PATH="$HOME/miniforge3/bin:$PATH" npm install @actions/artifact@4 fast-glob@3
          echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download stage 1
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-stage1.outputs.artifact-id }}, {
              path: "libretro/build/libretro-stage1",
            });
          '

      - name: Configure core
        run: |
          git config --global --add safe.directory "$(pwd)"
          CLICOLOR_FORCE=1 meson setup build --cross-file libretro/meson-switch.txt --buildtype release -Db_lto=true -Dlibretro=true -Dlibretro_save_states=true

      - name: Build core
        run: |
          mkdir ~/dist
          cd build
          CLICOLOR_FORCE=1 ninja -v
          mv mkxp-z_libretro.a ~/dist/libretro_libnx.a

      - id: upload-artifact
        name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir(process.env.HOME + "/dist");
            const artifact = new DefaultArtifactClient();
            const {id, size} = await artifact.uploadArtifact(
              "libretro_libnx.a.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact-id=${id}`);
          '

  build-libretro-switch-frontend:
    needs:
      - build-libretro-stage1
      - build-libretro-switch
    name: LR Nintendo Switch frontend ${{ matrix.type }}
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: standard
          - type: bootstrap
    steps:
      - name: Expose Actions environment
        uses: white-axe/expose-actions-environment@v1

      - name: Install dependencies
        shell: bash
        run: |
          curl -Lo ~/Miniforge3.sh "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash ~/Miniforge3.sh -b -p ~/miniforge3
          source ~/miniforge3/etc/profile.d/conda.sh
          conda install -y nodejs=22 git jq meson cmake
          PATH="$HOME/miniforge3/bin:$PATH" npm install @actions/artifact@4 fast-glob@3
          echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Download core
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            const artifact = new DefaultArtifactClient();
            await artifact.downloadArtifact(${{ needs.build-libretro-switch.outputs.artifact-id }}, {
              path: "libretro_libnx",
            });
          '

      - name: Build frontend
        run: |
          mkdir ~/dist
          mv libretro_libnx/libretro_libnx.a ~
          tag_name=$(curl -s https://api.github.com/repos/libretro/RetroArch/releases/latest -H 'Authorization: Bearer ${{ github.token }}' -H 'X-GitHub-Api-Version: 2022-11-28' | jq -r '.tag_name')
          if [ "$tag_name" = 'v1.22.2' ]
          then
            mv libretro/retroarch-pr18459.patch ~
          fi
          if [ '${{ matrix.type }}' = 'bootstrap' ]
          then
            mv libretro/switch-bootstrap ~
          fi
          cd ~
          git clone https://github.com/libretro/RetroArch retroarch --depth 1 -b $tag_name
          mv libretro_libnx.a retroarch/
          cd retroarch
          if [ "$tag_name" = 'v1.22.2' ]
          then
            git apply ~/retroarch-pr18459.patch
          fi
          if [ '${{ matrix.type }}' = 'bootstrap' ]
          then
            git apply ~/switch-bootstrap/switch-bootstrap.patch
            CLICOLOR_FORCE=1 make -f Makefile.libnx LIBRETRO=mkxp-z
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip retroarch_switch.elf
            mv retroarch_switch.elf ~/dist/mkxp-z_libretro_libnx.elf
          else
            CLICOLOR_FORCE=1 make -f Makefile.libnx LIBRETRO=mkxp-z
            mv retroarch_switch.nro ~/dist/mkxp-z_libretro_libnx.nro
          fi

      - name: Upload artifact
        run: |
          node --input-type=module -e '
            import {DefaultArtifactClient} from "@actions/artifact";
            import fg from "fast-glob";
            process.chdir(process.env.HOME + "/dist");
            const artifact = new DefaultArtifactClient();
            await artifact.uploadArtifact(
              "mkxp-z_libretro.switch.${{ matrix.type }}.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name }}-${{ needs.build-libretro-stage1.outputs.sha }}",
              fg.globSync("**"),
              ".",
            );
          '
