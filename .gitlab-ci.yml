  #################################### MISC ##################################
  # Emscripten
  - project: 'libretro-infrastructure/ci-templates'
    file: '/emscripten-static.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

##############################################################################
#################################### STAGES ##################################
##############################################################################

stage1:
  image: debian:stable-slim
  stage: build-prepare
  before_script:
    - apt update
    - apt install -y git curl build-essential automake libtool zip universal-ctags ruby
    - curl -Lo ~/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
    - mkdir ~/wasi-sdk
    - tar -xzf ~/wasi-sdk.tar.gz -C ~/wasi-sdk --strip-components=1
    - rm ~/wasi-sdk.tar.gz
    - curl -Lo ~/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz
    - mkdir ~/binaryen
    - tar -xzf ~/binaryen.tar.gz -C ~/binaryen --strip-components=1
    - rm ~/binaryen.tar.gz
  script:
    - cd libretro
    - CLICOLOR_FORCE=1 make -j $(($(nproc)/5)) WASI_SDK="$HOME/wasi-sdk" WASM_OPT="$HOME/binaryen/bin/wasm-opt"
  artifacts:
    paths:
      - libretro/build/libretro-stage1/
    expire_in: 1 day

