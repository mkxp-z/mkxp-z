# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

# Core definitions
.core-defs:
  variables:
    CORENAME: mkxp-z
    MAKEFILE: Makefile.libretro

.needs-shared:
  dependencies:
    - stage1

.needs-static:
  needs:
    - job: stage1
      artifacts: true

.miniforge:
  before_script:
    - curl -Lo ~/Miniforge3.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
    - bash ~/Miniforge3.sh -b -p ~/miniforge3
    - source ~/miniforge3/etc/profile.d/conda.sh
    - conda install -y ${MINIFORGE_PACKAGES}
    - export PATH="$HOME/miniforge3/bin:$PATH"

.deps-linux:
  extends:
    - .miniforge
  variables:
    MINIFORGE_PACKAGES: git meson cmake
  before_script:
    - !reference [.miniforge, before_script]
    - git config --global --add safe.directory "$(pwd)"

.deps-linux-alpine:
  before_script:
    - sudo apk add git python3 gcc g++ ninja
    - python3 -m ensurepip
    - python3 -m pip install meson cmake
    - export PATH="$HOME/.local/bin:$PATH"
    - git config --global --add safe.directory "$(pwd)"

# Inclusion templates, required for the build to work
