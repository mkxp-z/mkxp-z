filter = assets/
filter = binding/
filter = linux/
filter = macos/
filter = scripts/
filter = shader/
filter = src/
filter = windows/

# Theming for HTML coverage reports.
html-title = mkxp-z coverage report
html-theme = boost.green

# Allow two identically named functions to exist in the same source code file when merging multiple coverage reports.
# This can happen, for example, if there are multiple implementations of the same function, with only one implementation enabled using the C preprocessor depending on the operating system.
merge-mode-functions = separate
